<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Forest fire simulation</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
      <header class="topbar">
        <h1>Drossel&ndash;Schwabl Forest Fire Model</h1>
      </header>

      <div class="layout">
        <div class="left-panel">
          <canvas id="grid-canvas" width="440" height="440"></canvas>

          <div class="controls-row">
            <div class="buttons">
              <button id="btn-step">Step</button>
              <button id="btn-play">Play</button>
              <button id="btn-reset">Reset</button>
            </div>
            <div class="stats">
              <p>Step <span id="step-count">0</span></p>
              <p>Density <span id="density-out">0%</span></p>
            </div>
          </div>
          <label class="toggle-row" for="animation-toggle">
            <span>Animate fire spread</span>
            <input type="checkbox" id="animation-toggle">
            <span class="toggle-switch"></span>
          </label>
        </div>

        <div class="right-panel">
          <div class="slider-group">
            <label for="p-slider">Growth rate p: <span id="p-out">0.01</span></label>
            <input type="range" min="0" max="0.2" step="0.001" value="0.01" id="p-slider">
          </div>

          <div class="slider-group">
            <label for="f-slider">Lightning strike probability f: <span id="f-out">0.001</span></label>
            <input type="range" min="0" max="0.02" step="0.0001" value="0.001" id="f-slider">
          </div>

          <div class="slider-group">
            <label for="grid-slider">Grid size: <span id="size">80</span></label>
            <input type="range" min="40" max="400" step="1" value="80" id="grid-slider">
          </div>

          <div class="slider-group">
            <label for="fps-slider">Steps per second: <span id="fps">20</span></label>
            <input type="range" min="10" max="60" step="1" value="20" id="fps-slider">
          </div>
        </div>  
      </div>

      <script src="app.js"></script>
    </body>
</html>
